
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Huellitas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <h1>Huellitas de Amor</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="mascotas.html">Mascotas</a>
            <a href="solicitud.html">Adoptar</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <section class="presentacion">
        <h2>Iniciar sesión</h2>

        <p>
            Accede al sistema de administración de Huellitas.
        </p>
    </section>

    <section class="formulario">

        <form>

            <h3>Acceso de administrador</h3>

            <label for="correo">Correo electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo"
                required
            >

            <label for="contrasena">Contraseña:</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresa tu contraseña"
                required
            >

            <button type="submit">Ingresar</button>

        </form>

    </section>

    <footer>
        <h3>Huellitas</h3>
        <p>Una segunda oportunidad comienza con una adopción.</p>
        <p>© 2026 Huellitas. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
